[pylithapp.metadata]
# This is not a self-contained simulation configuration file. This
# file only specifies the general parameters common to the simulations
# in this directory.
authors = [Charles Williams]
pylith_version = [>=4.0, <6.0]
keywords = [test, 3D]
features = [
    Tetrahedral cells,
    pylith.meshio.MeshIOCubit,
    pylith.problems.TimeDependent,
    pylith.meshio.OutputSolnBoundary,
    pylith.meshio.DataWriterHDF5,
    pylith.bc.DirichletTimeDependent,
    pylith.bc.ZeroDB,
    spatialdata.geocoords.CSGeo
    ]

# ----------------------------------------------------------------------
# journal
# ----------------------------------------------------------------------
[pylithapp.journal]
device = color-console

# ----------------------------------------------------------------------
# mesh initialization
# ----------------------------------------------------------------------
# Use local transvers Mercator projection.
[pylithapp.problem.mesh_initializer.phases.read_mesh.reader]
coordsys = spatialdata.geocoords.CSGeo
coordsys.space_dim = 3
coordsys.crs_string = +proj=tmerc +datum=WGS84 +lon_0=175.6 +lat_0=-39.1 +k=0.9996

[pylithapp.problem.scales]
length_scale = 500.0*m

[pylithapp.petsc]
ksp_atol = 2.0e-8

# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
# Set the default quadrature order for all subfields.
#
# IMPORTANT: The quadrature order *must* the same for all solution and
# auxiliary subfields. PyLith will verify that this requirement is met.
# This requirement may be relaxed in the future.
defaults.quadrature_order = 1

[pylithapp.problem.solution.subfields]
displacement.basis_order = 1

[pylithapp.problem]
solution_observers = [domain, groundsurf]
solution_observers.groundsurf = pylith.meshio.OutputSolnBoundary

[pylithapp.problem.solution_observers.domain]
trigger.num_skip = 1

[pylithapp.problem.solution_observers.groundsurf]
trigger.num_skip = 1

# ----------------------------------------------------------------------
# materials
# ----------------------------------------------------------------------
# For all of the examples, we have two materials: the shell surrounding the
# hollow chamber, and the surrounding crust.
[pylithapp.problem]
materials = [crust, shell]

# End of file
