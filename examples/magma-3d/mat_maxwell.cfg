[pylithapp.metadata]
keywords = [elasticity]
features = [
    pylith.materials.Elasticity,
    pylith.materials.IsotropicLinearMaxwell,
    spatialdata.spatialdb.SimpleDB
    ]

# Parameters for using Maxwell viscoelastic material models for the 'crust'
# and 'shell'.
#
# We use a SimpleDB with a single point for each material.

[pylithapp.problem.materials]
crust = pylith.materials.Elasticity
shell = pylith.materials.Elasticity

crust.bulk_rheology = pylith.materials.IsotropicLinearMaxwell
shell.bulk_rheology = pylith.materials.IsotropicLinearMaxwell

# Crust
# Note that we use different properties for the crust and shell.
[pylithapp.problem.materials.crust]
# The label value matches the value given to 'crust' when generating the mesh.
label_value = 1

# SimpleDB provides values at a single point, so we use default 'nearest' interpolation.
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Properties for surrounding crust
db_auxiliary_field.iohandler.filename = mat_crust_maxwell.spatialdb

# Output all possible values.
observers.observer.data_fields = [displacement, cauchy_stress, cauchy_strain, viscous_strain]

# Basis order zero since properties are constant.
auxiliary_subfields.density.basis_order = 0
bulk_rheology.auxiliary_subfields.bulk_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.shear_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.maxwell_time.basis_order = 0

# Basis order set here assumes solution (displacement) is basis order 2.
derived_subfields.cauchy_strain.basis_order = 1
derived_subfields.cauchy_stress.basis_order = 1

# Shell
[pylithapp.problem.materials.shell]
# The label value matches the value given to 'shell' when generating the mesh.
label_value = 2

# SimpleDB provides values at a single point, so we use default 'nearest' interpolation.
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Properties for shell surrounding magma chamber
db_auxiliary_field.iohandler.filename = mat_shell_maxwell.spatialdb

# Output all possible values.
observers.observer.data_fields = [displacement, cauchy_stress, cauchy_strain, viscous_strain]

# Basis order zero since properties are constant.
auxiliary_subfields.density.basis_order = 0
bulk_rheology.auxiliary_subfields.bulk_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.shear_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.maxwell_time.basis_order = 0

# Basis order set here assumes solution (displacement) is basis order 2.
derived_subfields.cauchy_strain.basis_order = 1
derived_subfields.cauchy_stress.basis_order = 1

# End of file
