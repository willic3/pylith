[pylithapp.metadata]
base = [pylithapp.cfg]
description = Maxwell viscoelastic response to normal tractions on boundary of spherical cavity using adaptive time stepping.
authors = [Charles Williams]
keywords = [Hollow sphere, Maxwell viscoelasticity, spherical shell, Dirichlet BC, basis order 2, adaptive time stepping]
arguments = [mat_maxwell.cfg, step02b_cavity_maxwell.cfg]
version = 1.0.0
pylith_version = [>=3.0, <6.0]

features = [
    Quasi-static simulation,
    Adaptive time stepping,
    pylith.materials.IsotropicLinearMaxwell,
    pylith.problems.TimeDependent,
    pylith.bc.DirichletTimeDependent,
    pylith.bc.NeumannTimeDependent,
    spatialdata.spatialdb.UniformDB,
    spatialdata.spatialdb.ZeroDB,
    pylith.meshio.OutputSolnBoundary,
    pylith.meshio.DataWriterHDF5
    ]


 # ----------------------------------------------------------------------
# mesh initialization
# ----------------------------------------------------------------------
[pylithapp.problem.mesh_initializer.phases.read_mesh]
reader = pylith.meshio.MeshIOPetsc
reader.filename = mesh_tet.msh

# ----------------------------------------------------------------------
# output
# ----------------------------------------------------------------------
[pylithapp.problem]
# Set the name of the problem that will be used to construct the
# output filenames. The default directory for output is 'output'.
defaults.name = step02b_cavity_maxwell

# ----------------------------------------------------------------------
# problem
# ----------------------------------------------------------------------
[pylithapp.problem]
# Set the default quadrature order for all subfields.
#
# # IMPORTANT: The quadrature order *must* the same for all solution and
# auxiliary subfields. PyLith will verify that this requirement is met.
# This requirement may be relaxed in the future.
defaults.quadrature_order = 2

[pylithapp.problem.solution.subfields.displacement]
basis_order = 2

[pylithapp.problem]
# Time step information using default uniform time stepping.
start_time = -0.01*year
initial_dt = 0.01*year
end_time = 5.0*year

# Switch to PETSc adaptive time stepping.
petsc_defaults.adaptive_time_stepping = True

# Set scales appropriate for Maxwell viscoelastic material.
scales = pylith.scales.QuasistaticElasticity
scales.length_scale = 4.0*km
scales.displacement_scale = 1.0*m
scales.shear_modulus = 13.0*GPa
scales.time_scale = 0.24*year

# Set solution observers.
solution_observers = [domain, groundsurf, cavitysurf, shellsurf]
solution_observers.groundsurf = pylith.meshio.OutputSolnBoundary
solution_observers.cavitysurf = pylith.meshio.OutputSolnBoundary
solution_observers.shellsurf = pylith.meshio.OutputSolnBoundary

[pylithapp.problem.solution_observers.groundsurf]
label = boundary_top
label_value = 15

[pylithapp.problem.solution_observers.cavitysurf]
label = boundary_cavity
label_value = 20

[pylithapp.problem.solution_observers.shellsurf]
label = interface_shell
label_value = 21

# ----------------------------------------------------------------------
# boundary conditions
# ----------------------------------------------------------------------
[pylithapp.problem]
# External boundaries (except top) + sphere boundary.
bc = [bc_west, bc_east, bc_south, bc_north, bc_bottom, bc_sphere_surface]
bc.bc_west = pylith.bc.DirichletTimeDependent
bc.bc_east = pylith.bc.DirichletTimeDependent
bc.bc_south = pylith.bc.DirichletTimeDependent
bc.bc_north = pylith.bc.DirichletTimeDependent
bc.bc_bottom = pylith.bc.DirichletTimeDependent
bc.bc_sphere_surface = pylith.bc.NeumannTimeDependent

# -x face
[pylithapp.problem.bc.bc_west]
label = boundary_west
label_value = 13
constrained_dof = [0]

db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet displacement BC on -x

# +x face
[pylithapp.problem.bc.bc_east]
label = boundary_east
label_value = 11
constrained_dof = [0]

db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet displacement BC on +x

# -y face
[pylithapp.problem.bc.bc_south]
label = boundary_south
label_value = 10
constrained_dof = [1]

db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet displacement BC on -y

# +y face
[pylithapp.problem.bc.bc_north]
label = boundary_north
label_value = 12
constrained_dof = [1]

db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet displacement BC on +y

# -z face
[pylithapp.problem.bc.bc_bottom]
label = boundary_bottom
label_value = 14
constrained_dof = [2]

db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet displacement BC on -z

# Neumann (normal traction) boundary conditions on the inner surface of the sphere.
[pylithapp.problem.bc.bc_sphere_surface]
label = boundary_cavity
label_value = 20
use_initial = True

# The traction is constant on the boundary so we use a `UniformDB` and
# basis order of 0.
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Neumann BC internal sphere
db_auxiliary_field.values = [initial_amplitude_tangential_1, initial_amplitude_tangential_2, initial_amplitude_normal]
db_auxiliary_field.data = [0.0*MPa, 0.0*MPa, -10.0*MPa]

auxiliary_subfields.initial_amplitude.basis_order = 0

# Refine output to reflect higher basis order.
[pylithapp.problem.solution_observers.domain]
refine_levels = 1

[pylithapp.problem.solution_observers.groundsurf]
refine_levels = 1

[pylithapp.problem.solution_observers.cavitysurf]
refine_levels = 1

[pylithapp.problem.solution_observers.shellsurf]
refine_levels = 1

[pylithapp.problem.materials.crust.observers.observer]
refine_levels = 1

[pylithapp.problem.materials.shell.observers.observer]
refine_levels = 1

# End of file
