[pylithapp.metadata]
keywords = [poroelasticity]
features = [
    pylith.materials.Poroelasticity,
    pylith.materials.IsotropicLinearPoroelasticity,
    spatialdata.spatialdb.UniformDB
    ]

# Parameters for using poroelastic material models for the 'crust'
# and 'shell'.
#
# We use a UniformDB for each material.
# The crust and the shell surrounding the cavity have different properties.
[pylithapp.problem.materials]
crust = pylith.materials.Poroelasticity
shell = pylith.materials.Poroelasticity

crust.bulk_rheology = pylith.materials.IsotropicLinearPoroelasticity
shell.bulk_rheology = pylith.materials.IsotropicLinearPoroelasticity

# Crust
[pylithapp.problem.materials.crust]
# The label value matches the value given to 'crust' when generating the mesh.
label_value = 1

# We use uniform properties for each material, so we use a UniformDB.
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Poroelastic properties for the crust
db_auxiliary_field.values = [solid_density, fluid_density, fluid_viscosity, porosity, shear_modulus, drained_bulk_modulus, biot_coefficient, fluid_bulk_modulus, isotropic_permeability]
db_auxiliary_field.data  = [ 2500*kg/m**3, 1000*kg/m**3, 0.001*Pa*s, 0.01, 6.0*GPa, 10.0*GPa, 1.0, 2.0*GPa, 1e-15*m**2]

# Set basis order to 0 for uniform properties and a basis order of 1 for Cauchy stress and strain.
auxiliary_subfields.body_force.basis_order = 0
auxiliary_subfields.solid_density.basis_order = 0
auxiliary_subfields.fluid_density.basis_order = 0
auxiliary_subfields.fluid_viscosity.basis_order = 0
auxiliary_subfields.gravitational_acceleration.basis_order = 0
auxiliary_subfields.porosity.basis_order = 0

# Basis order set here assumes solution (displacement) is basis order 2.
derived_subfields.cauchy_strain.basis_order = 1
derived_subfields.cauchy_stress.basis_order = 1

# Output all possible values.
observers.observer.data_fields = [displacement, trace_strain, pressure, bulk_density, porosity, isotropic_permeability]

[pylithapp.problem.materials.crust.bulk_rheology]
# Set basis order to 0 for uniform properties
auxiliary_subfields.drained_bulk_modulus.basis_order = 0
auxiliary_subfields.shear_modulus.basis_order = 0
auxiliary_subfields.biot_coefficient.basis_order = 0
auxiliary_subfields.biot_modulus.basis_order = 0
auxiliary_subfields.isotropic_permeability.basis_order = 0

# Shell
[pylithapp.problem.materials.shell]
# The label value matches the value given to 'shell' when generating the mesh.
label_value = 2

# We will use uniform material properties, so we use a UniformDB.
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Poroelastic properties
db_auxiliary_field.values = [solid_density, fluid_density, fluid_viscosity, porosity, shear_modulus, drained_bulk_modulus, biot_coefficient, fluid_bulk_modulus, isotropic_permeability]
db_auxiliary_field.data = [ 2500*kg/m**3,  1000*kg/m**3, 0.001*Pa*s, 0.1, 6.0*GPa, 10.0*GPa, 0.8, 2.0*GPa, 1e-13*m**2]

# Set basis order to 0 for uniform properties and a basis order of 1 for Cauchy stress and strain.
auxiliary_subfields.body_force.basis_order = 0
auxiliary_subfields.solid_density.basis_order = 0
auxiliary_subfields.fluid_density.basis_order = 0
auxiliary_subfields.fluid_viscosity.basis_order = 0
auxiliary_subfields.gravitational_acceleration.basis_order = 0
auxiliary_subfields.porosity.basis_order = 0

# Basis order set here assumes solution (displacement) is basis order 2.
derived_subfields.cauchy_strain.basis_order = 1
derived_subfields.cauchy_stress.basis_order = 1
# Output all possible values.
observers.observer.data_fields = [displacement, trace_strain, pressure, bulk_density, porosity, isotropic_permeability]

[pylithapp.problem.materials.shell.bulk_rheology]
# Set basis order to 0 for uniform properties
auxiliary_subfields.drained_bulk_modulus.basis_order = 0
auxiliary_subfields.shear_modulus.basis_order = 0
auxiliary_subfields.biot_coefficient.basis_order = 0
auxiliary_subfields.biot_modulus.basis_order = 0
auxiliary_subfields.isotropic_permeability.basis_order = 0

# End of file
